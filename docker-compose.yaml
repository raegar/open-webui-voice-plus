services:
  open-webui:
    build:
      context: .
      dockerfile: Dockerfile
    image: open-webui-voice-plus:latest
    container_name: open-webui
    restart: always
    ports:
      - "3000:8080"
    volumes:
      - open-webui:/app/backend/data
      - E:/Development/productivity/sweet-mail-biscuits:/app/sweetmail
      # The persistent memory pipeline's data, for the Memories browser. The
      # pipelines container writes the same files; both run in Docker's VM, so
      # SQLite's locks coordinate them.
      - C:/AI/persistent-ai-memory/.ai_memory:/app/ai_memory
    extra_hosts:
      - host.docker.internal:host-gateway
    environment:
      # Read from the gitignored .env next to this file. This repo is public, so
      # the key itself must never be written here.
      - WEBUI_SECRET_KEY=${WEBUI_SECRET_KEY:?Set WEBUI_SECRET_KEY in .env}
      - TZ=Europe/London
      - ENABLE_IMAGE_GENERATION=True
      - AUTOMATIC1111_BASE_URL=http://host.docker.internal:7861
      - ENABLE_VIDEO_GENERATION=True
      - COMFYUI_VIDEO_BASE_URL=http://host.docker.internal:8188
      # A 15s Ref2VA render can exceed 11 minutes; the 600s default abandons
      # the poll while ComfyUI is still working, orphaning a finished video.
      - COMFYUI_VIDEO_TIMEOUT=2400
      - MEMORY_BROWSER_DB=/app/ai_memory/conversations.db
      - |
        IMAGE_PROMPT_GENERATION_PROMPT_TEMPLATE=### Task:
        Extract or generate an image generation prompt based on the assistant's most recent response in the chat history. The assistant may have described a scene, character, or image it wants to create — your job is to distill that into a clean, detailed image generation prompt.

        ### Guidelines:
        - Focus primarily on the assistant's last message for visual details
        - Extract specific details: subject, appearance, setting, lighting, mood, style
        - If the assistant explicitly described what it wants to generate, use that description faithfully
        - Do not include conversational text, names, or narrative — only visual elements
        - Be specific about colours, materials, poses, expressions, environment
        - Use the chat's primary language; default to English if multilingual

        ### Output:
        Strictly return in JSON format:
        {
            "prompt": "Your detailed visual description here."
        }

        ### Chat History:
        <chat_history>
        {{MESSAGES:END:6}}
        </chat_history>

volumes:
  open-webui:
    external: true   # existing named volume — all chat history and settings preserved